services:
  bot:
    build: .
    image: mediabot:${GIT_SHA:-local}
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - jobs:/data/jobs
      - ./data/state:/data/state
      - ./data/session:/data/session
      - ./secrets/cookies:/run/cookies:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 256
    ulimits:
      nofile: {soft: 4096, hard: 8192}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks: [botnet]
    # no ports: long polling only

volumes:
  jobs: {}

networks:
  botnet:
    driver: bridge
    ipam:
      config:
        # Pick one that doesn't clash (check `docker network ls`). Must match
        # BOT_SUBNET in deploy/egress-firewall.sh.
        - subnet: 172.30.99.0/24
